name: Build Windows Desktop

on:
  push:
    branches:
      - build/windows-desktop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install uv
        shell: pwsh
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $ffmpeg = (Get-Command ffmpeg.exe).Source
          Copy-Item $ffmpeg .\ffmpeg.exe

      - name: Build desktop application
        shell: pwsh
        run: .\build_windows.ps1

      - name: Create distribution archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\dist\DouyinLiveRecorderDesktop\* `
            -DestinationPath .\DouyinLiveRecorderDesktop-Windows-x64.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DouyinLiveRecorderDesktop-Windows-x64
          path: DouyinLiveRecorderDesktop-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
